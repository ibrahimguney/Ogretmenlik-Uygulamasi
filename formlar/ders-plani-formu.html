<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ders Planı Formu</title><style>body{font:16px/1.5 system-ui;margin:0;background:#f5f7f6;color:#17212b}main{max-width:850px;margin:auto;padding:28px 18px}h1{color:#08494e}label{display:block;font-weight:700;margin-top:18px}input,textarea,select{width:100%;padding:10px;margin-top:6px;border:1px solid #b9c9c5;border-radius:6px;font:inherit}textarea{min-height:90px}button,a.btn{display:inline-block;margin-top:22px;padding:11px 16px;border:0;border-radius:6px;background:#0d6970;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.note{background:#e8f2ef;padding:12px;border-left:4px solid #0d6970}.actions{display:flex;gap:10px}@media print{.actions,.note{display:none}body{background:#fff}}</style></head><body><main><p>ÖĞRETMENLİK UYGULAMASI I · FORM 02</p><h1>Ders Planı Taslağı</h1><p class="note">Planın öğrenme çıktısı, etkinlik ve ölçme kanıtı aynı amaca hizmet etmelidir.</p><form id="f"><label>Tarih ve sınıf <input name="baglam"></label><label>Ders ve konu <input name="konu"></label><label>Öğrenme çıktısı <textarea name="cikti"></textarea></label><label>Ön bilgiler ve bireysel farklılıklar <textarea name="farklilik"></textarea></label><label>Başlangıç ve merak uyandırma <textarea name="baslangic"></textarea></label><label>Öğrenme etkinliği ve öğretmen soruları <textarea name="etkinlik"></textarea></label><label>Farklılaştırma veya destek <textarea name="destek"></textarea></label><label>Öğrenme kanıtı ve ölçme aracı <textarea name="olcme"></textarea></label><label>Ders sonrası revizyon notu <textarea name="revizyon"></textarea></label><div class="actions"><button type="button" onclick="save()">Tarayıcıya kaydet</button><button type="button" onclick="window.print()">Yazdır / PDF</button></div></form><p class="note"><strong>Gönderim kuralı:</strong> Bu form GitHub’a veri göndermez. Doldurulan bilgi yalnızca bu tarayıcıda tutulur. PDF çıktısını kurumun belirlediği kanaldan teslim edin.</p></main><script>function save(){localStorage.setItem('ou-plan',JSON.stringify(Object.fromEntries(new FormData(document.querySelector('#f')))));alert('Form bu tarayıcıya kaydedildi.')}function load(){const x=JSON.parse(localStorage.getItem('ou-plan')||'{}');Object.keys(x).forEach(k=>{const e=document.querySelector('[name='+k+']');if(e)e.value=x[k]})}load();</script></body></html>
