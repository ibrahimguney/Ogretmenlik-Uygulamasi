<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haftalık QR Kodlar</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:24px;color:#17212b}h1{color:#08494e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{text-align:center;border:1px solid #dce5e2;padding:15px;border-radius:10px}.card img{width:170px;height:170px}.card a{display:block;color:#0d6970;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}@media print{.card{break-inside:avoid}}</style></head><body><h1>Öğretmenlik Uygulaması I · Haftalık QR Kodlar</h1><p>QR kodlar GitHub Pages adresindeki haftalık içeriğe yönlendirir. Pages adresi etkinleştirildikten sonra kullanın.</p><div id="g" class="grid"></div><script>const base='https://ibrahimguney.github.io/Ogretmenlik-Uygulamasi/haftalar/hafta-';const g=document.querySelector('#g');for(let i=1;i<=12;i++){const n=String(i).padStart(2,'0'),u=base+n+'.md',img='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(u);g.innerHTML+='<div class="card"><img src="'+img+'" alt="Hafta '+n+' QR kodu"><strong>Hafta '+n+'</strong><a href="'+u+'">İçeriği aç</a></div>'}</script></body></html>
